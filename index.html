<title>บ้านนาย (วัดเสมียนฯ)</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="บ้านนาย (วัดเสมียนฯ)">
<meta property="og:description" content="บันทึกการรับลูก + ดูแลบ้าน พร้อมติดตามค่าเดินทาง ค่าแรง และค่าใช้จ่าย">
<meta name="description" content="บันทึกการรับลูก + ดูแลบ้าน พร้อมติดตามค่าเดินทาง ค่าแรง และค่าใช้จ่าย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ── TOKENS ── */
:root {
  --p:          #1565C0;
  --p-mid:      #1976D2;
  --p-light:    #64B5F6;
  --p-pale:     #E3F2FD;
  --p-grad:     linear-gradient(145deg, #2196F3 0%, #0D47A1 100%);
  --bg:         #F2F7FF;
  --surface:    #FFFFFF;
  --th:         #0A2742;
  --tb:         #2C4A6B;
  --ts:         #6888A8;
  --border:     #C5DCF5;
  --ok:         #1B8A6B;
  --ok-bg:      #E4F8F1;
  --warn:       #C87900;
  --warn-bg:    #FFF3DC;
  --err:        #C0392B;
  --err-bg:     #FEEFED;
  --shadow:     0 2px 18px rgba(21,101,192,.10);
  --r:          14px;
  --rs:         9px;
}

/* app commits to light palette for readability — dark mode intentionally not applied */

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Sarabun',sans-serif;
  font-size:15px;line-height:1.55;
  background:var(--bg);color:var(--tb);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
textarea,input{font-family:inherit}
img{max-width:100%;display:block}

/* ── WRAPPER ── */
.app-wrap{max-width:540px;margin:0 auto;position:relative}

/* ── HEADER ── */
.app-header{
  background:var(--p-grad);
  padding:18px 18px 0;
  position:sticky;top:0;z-index:100;
  overflow:hidden;
}
.header-deco{
  position:absolute;right:-30px;top:-40px;
  width:160px;height:160px;
  background:rgba(255,255,255,.07);
  border-radius:50%;pointer-events:none;
}
.header-deco2{
  position:absolute;right:50px;top:-70px;
  width:100px;height:100px;
  background:rgba(255,255,255,.05);
  border-radius:50%;pointer-events:none;
}
.brand{display:flex;align-items:center;gap:10px;position:relative}
.brand-icon{
  width:42px;height:42px;
  background:rgba(255,255,255,.18);
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.brand-text h1{
  font-family:'Kanit',sans-serif;
  font-size:20px;font-weight:700;
  color:#fff;letter-spacing:.01em;
  text-wrap:balance;
}
.brand-text p{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:1px}
.tab-nav{
  display:flex;gap:4px;margin-top:14px;position:relative;
}
.tab-btn{
  flex:1;padding:11px 10px;
  border:none;
  background:rgba(255,255,255,.14);
  color:rgba(255,255,255,.72);
  border-radius:10px 10px 0 0;
  font-family:'Kanit',sans-serif;
  font-size:14px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .2s,color .2s;
  line-height:1;
}
.tab-btn.active{
  background:var(--surface);
  color:var(--p);font-weight:700;
}
.tab-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ── CONTENT ── */
.tab-panel{display:none;padding:14px 14px 48px}
.tab-panel.active{display:block}

/* ── STAT CARDS ── */
.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:9px;margin-bottom:14px;
}
.stat{
  background:var(--surface);
  border-radius:var(--r);
  padding:14px 8px;
  text-align:center;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.stat-n{
  font-family:'Kanit',sans-serif;
  font-size:18px;font-weight:700;line-height:1;
  color:var(--p);
  font-variant-numeric:tabular-nums;
}
.stat-n.ok{color:var(--ok)}
.stat-n.warn{color:var(--warn)}
.stat-n.money{font-size:14px}
/* ── ตัวเลขค้างเบิก — เด่นสุด ── */
.stat-n.big-red{
  color:#C0392B!important;
  font-size:42px;
  line-height:.95;
  text-shadow:0 2px 10px rgba(192,57,43,.25);
}
.stat-lbl{font-size:11px;color:var(--ts);margin-top:4px;font-weight:600;line-height:1.3}

/* ── CARD SHELL ── */
.card{
  background:var(--surface);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  margin-bottom:12px;
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;cursor:pointer;user-select:none;
}
.card-title{
  font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;
  color:var(--th);
  display:flex;align-items:center;gap:8px;
}
.card-icon{font-size:18px;transition:transform .25s}
.card-icon.open{transform:rotate(45deg)}
.card-body{padding:0 15px 15px;display:none}
.card-body.open{display:block}

/* ── FORM ── */
.fg{margin-bottom:13px}
.flbl{
  display:block;font-size:11px;font-weight:700;
  color:var(--ts);
  text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:6px;
}
.finput{
  width:100%;padding:10px 13px;
  border:1.5px solid var(--border);border-radius:var(--rs);
  background:var(--bg);color:var(--th);
  font-size:14px;outline:none;
  transition:border-color .18s;
  resize:vertical;
}
.finput:focus{border-color:var(--p-mid)}
.finput::placeholder{color:var(--ts)}

/* ── DATE PICKER ── */
.date-row{display:flex;gap:6px}
.date-row .finput{flex:1;min-width:0;padding-left:8px;padding-right:4px;appearance:none;-webkit-appearance:none;cursor:pointer}
.date-row .finput.mm{flex:2.2}
.date-row .finput.yy{flex:1.6}

/* ── STATUS TOGGLES ── */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-wrap{position:relative}
.st-wrap input{position:absolute;opacity:0;width:0;height:0}
.st-lbl{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border:1.5px solid var(--border);
  border-radius:var(--rs);background:var(--bg);
  color:var(--tb);font-size:13px;cursor:pointer;
  transition:all .18s;
}
.st-dot{
  width:20px;height:20px;border-radius:50%;
  background:var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;
  transition:all .18s;
}
.st-wrap input:checked + .st-lbl{
  border-color:var(--ok);background:var(--ok-bg);
  color:var(--ok);font-weight:600;
}
.st-wrap input:checked + .st-lbl .st-dot{
  background:var(--ok);color:#fff;
}

/* ── PHOTO ── */
.photo-row{display:flex;align-items:center;gap:10px}
.photo-pick{
  display:flex;align-items:center;gap:7px;
  padding:9px 14px;
  border:1.5px dashed var(--p-light);border-radius:var(--rs);
  background:var(--p-pale);color:var(--p);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:background .18s;flex-shrink:0;
}
.photo-pick:hover{background:#d2eafe}
.photo-thumb{
  width:56px;height:56px;border-radius:9px;
  object-fit:cover;display:none;
  border:2px solid var(--border);
}

/* ── CLAIM CHECKBOX ── */
.claim-row{
  display:flex;align-items:center;gap:9px;
  padding:10px 13px;
  border:1.5px solid var(--border);border-radius:var(--rs);
  background:var(--bg);color:var(--tb);
  cursor:pointer;font-size:13px;user-select:none;
}
.claim-row input{margin:0;width:16px;height:16px;accent-color:var(--p);cursor:pointer}

/* ── PRIMARY BUTTON ── */
.btn-pri{
  width:100%;padding:13px;
  background:var(--p-grad);color:#fff;border:none;
  border-radius:var(--rs);
  font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;
  transition:opacity .18s;
}
.btn-pri:hover{opacity:.9}
.btn-pri:active{opacity:.8}
.btn-pri:focus-visible{outline:2px solid var(--p);outline-offset:2px}

/* ── DIVIDER ── */
.divider{
  display:flex;align-items:center;gap:10px;
  margin:16px 0 12px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{
  font-size:11px;font-weight:700;color:var(--ts);
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
}

/* ── RECORD CARD ── */
.rec{
  background:var(--surface);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  margin-bottom:10px;overflow:hidden;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rec{animation:slideIn .22s ease}
@media(prefers-reduced-motion:reduce){.rec{animation:none}}

.rec-head{
  padding:12px 14px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.rec-date{
  font-family:'Kanit',sans-serif;
  font-size:14px;font-weight:600;color:var(--th);
}
.rec-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:20px;
  font-size:11px;font-weight:700;line-height:1.4;
}
.tag-ok{
background:var(--ok-bg);color:var(--ok)}
.tag-no{background:var(--err-bg);color:var(--err)}
.tag-claim{background:var(--p-pale);color:var(--p)}
.tag-pending{background:var(--warn-bg);color:var(--warn)}

.rec-photo{width:100%;max-height:180px;object-fit:cover;border-top:1px solid var(--border)}
.rec-note{
  padding:8px 14px;font-size:13px;color:var(--ts);
  border-top:1px solid var(--border);background:var(--bg);
}
.rec-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn-del{
  width:30px;height:30px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--ts);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.btn-del:hover{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.btn-toggle{
  font-size:11px;font-weight:600;white-space:nowrap;
  padding:4px 10px;border-radius:20px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--ts);transition:all .18s;
}
.btn-toggle:hover{border-color:var(--p);color:var(--p)}

/* ── EXPENSE SECTION (house) ── */
.exp-zone{padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.exp-zone-lbl{
  font-size:11px;font-weight:700;color:var(--ts);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;
}
.exp-list{display:flex;flex-direction:column;gap:7px}
.exp-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 11px;
  border-radius:8px;background:var(--surface);
  border:1px solid var(--border);
}
.exp-name{flex:1;font-size:13px;color:var(--tb)}
.exp-amt{
  font-family:'Kanit',sans-serif;font-weight:600;font-size:13px;
  color:var(--th);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.exp-tag{cursor:pointer;user-select:none}

/* expense form rows */
.exp-form-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.exp-form-row input{
  padding:9px 10px;
  border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--th);font-size:13px;outline:none;
}
.exp-form-row input:focus{border-color:var(--p-mid)}
.exp-name-in{flex:1}
.exp-amt-in{width:82px}
.btn-del-sm{
  width:30px;height:30px;flex-shrink:0;border-radius:7px;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--ts);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.btn-del-sm:hover{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.btn-add-exp{
  width:100%;padding:9px;
  border:1.5px dashed var(--p-light);border-radius:var(--rs);
  background:var(--p-pale);color:var(--p);
  font-size:13px;font-weight:600;
  transition:background .18s;
}
.btn-add-exp:hover{border-color:var(--p-light);background:#d2eafe}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:32px 20px;color:var(--ts)}
.empty .ico{font-size:40px;margin-bottom:10px}
empty p{font-size:14px;line-height:1.6}

/* ── HISTORY LIST ── */
.hist{display:flex;flex-direction:column}

/* ── RECORD COLLAPSE ── */
.rec-body{display:none}
.rec-body.open{display:block}
.rec-chevron{font-size:12px;color:var(--ts);margin-left:4px;transition:transform .2s;display:inline-block}
.rec-chevron.open{transform:rotate(90deg)}

/* ── CAMERA MODAL ── */
#cam-modal{position:fixed;inset:0;z-index:600;background:#000;flex-direction:column;display:none}
#cam-modal.show{display:flex}
